services:
  task_api:
    build: .
    ports:
      - "${TASK_API_PORT:-8082}:8082"
    volumes:
      - ./src/tasks_api:/app/src/tasks_api
    environment:
      # PostgreSQL service defined below in this compose file.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-task_microservice}
      USER_API_DB_SCHEMA: ${USER_API_DB_SCHEMA:-user_api}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to the shared local HS256 signing secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: ["uvicorn", "src.tasks_api.main:app", "--host", "0.0.0.0", "--port", "8082", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shared_net

networks:
  shared_net:
    name: shared_net
    external: true
