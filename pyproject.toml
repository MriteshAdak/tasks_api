[project]
name = "tasks-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MriteshAdak", email = "mriteshadak@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asgi-correlation-id==4.3.4",
    "boto3==1.43.6",
    "fastapi[standard]==0.136.1",
    "mangum==0.21.0",
    "psycopg2-binary==2.9.12",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.13.0",
    "python-dotenv==1.2.2",
    "sqlalchemy==2.0.49",
    "structlog==25.5.0",
]

[project.scripts]
tasks-api = "tasks_api:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
db = [
    "alembic==1.18.4",
]
dev = [
    "black>=26.5.1",
    "httpx>=0.28.1",
    "isort>=9.0.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]


[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # Pycodestyle errors
    "F",   # Pyflakes
    "I",   # Import sorting (replaces isort)
    "UP",  # Pyupgrade
    "B",   # Bugbear
]
ignore = [
    "B008",  # Do not perform function call `Depends` in argument defaults (FastAPI pattern)
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.Query"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
